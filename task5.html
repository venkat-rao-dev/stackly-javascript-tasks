<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Study Tracker</title>
    <link rel="stylesheet" href="task5.css">
</head>
<body>

    <div class="container">
        <h1>Daily Study Tracker</h1>
        <p class="subtitle">Track your daily learning progress</p>

        <div class="date-card">
            <h2>Today's Date</h2>
            <p id="currentDate"></p>
            <p id="currentTime"></p>
            <p id="dateDetails"></p>
        </div>

        <div class="summary">
            <div class="card">
                <h3>Total Activities</h3>
                <p id="totalActivities">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedActivities">0</p>
            </div>

            <div class="card">
                <h3>Total Study Time</h3>
                <p id="totalTime">0 minutes</p>
            </div>
        </div>

        <div class="activities">
            <h2>My Study Activities</h2>
            <div id="activityList"></div>
        </div>
    </div>

    <script src="task5.js"></script>
</body>
</html>
